<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post a Job — JobBoard</title>
  <meta name="description" content="Hire top talent. Post a job on our board." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">💼 JobBoard</a>
      <div class="nav-links">
        <a href="index.html#jobs">Browse</a>
        <a href="post.html" style="color:#2563eb; font-weight:600;">Post a Job</a>
        <a href="index.html#about">About</a>
        <a href="mailto:jacksonkahindi727@gmail.com">Contact</a>
      </div>
    </div>
  </nav>

  <main class="container" style="max-width: 600px;">
    <div class="form-container">
      <h1>Post a Job</h1>
      <p>Reach thousands of qualified candidates. Fill out the form below and we'll review your listing.</p>

      <!-- IMPORTANT: Replace the action URL below with your Formspree URL from Step 1 -->
      <form action="https://formspree.io/f/mzerdyzy" method="POST" class="job-form">
        
        <div class="form-group">
          <label for="company">Company Name *</label>
          <input type="text" id="company" name="company" required placeholder="Acme Corp" />
        </div>

        <div class="form-group">
          <label for="title">Job Title *</label>
          <input type="text" id="title" name="title" required placeholder="Senior React Engineer" />
        </div>

        <div class="form-group">
          <label for="location">Location *</label>
          <input type="text" id="location" name="location" required placeholder="Remote, New York, London..." />
        </div>

        <div class="form-group">
          <label for="salary">Salary Range (Optional)</label>
          <input type="text" id="salary" name="salary" placeholder="$100,000 - $150,000" />
        </div>

        <div class="form-group">
          <label for="apply_url">Application URL or Email *</label>
          <input type="text" id="apply_url" name="apply_url" required placeholder="https://yoursite.com/careers or hr@company.com" />
        </div>

        <div class="form-group">
          <label for="description">Job Description *</label>
          <textarea id="description" name="description" rows="6" required placeholder="Describe the role, requirements, and benefits..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Job ($49)</button>
        <p class="form-note">Note: Payment instructions will be emailed to you after review.</p>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2024 JobBoard — Built by me.</p>
    </div>
  </footer>
</body>
</html>
